# Site settings
title: Dave Gooding
description: >-
  Dave Gooding, co-founder and CTO of Foundational. Satellite laser ranging,
  space optics, and knowing precisely where things are in orbit.
url: https://davegooding.com
baseurl: ""
lang: en-GB
timezone: Europe/London

author:
  name: Dave Gooding
  url: https://davegooding.com
  image: /images/me.png
  job_title: Co-founder & CTO
  works_for:
    name: Foundational
    url: https://foundational.space
  links:
    linkedin: https://www.linkedin.com/in/dave-gooding-82b71259/
