# Used by jekyll-seo-tag
logo: /images/me.png
social:
  name: Dave Gooding
  links:
    - https://www.linkedin.com/in/dave-gooding-82b71259/
    - https://github.com/davidjongooding
    - https://orcid.org/0009-0000-6157-1657
    - https://scholar.google.com/citations?user=BFtzs9sAAAAJ
    - https://www.researchgate.net/profile/David-Gooding
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, permalink: /writing/:slug/ }
  - scope: { path: "" }
    values: { image: /images/og-default.png }

# GoatCounter site code: the part before .goatcounter.com (cookie-free analytics).
goatcounter: "davegooding"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  footnote_backlink: "↩"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - WRITING.md
  - LICENSE
  - vendor
  - .bundle
  - "*.py"

theme: null
