<footer class="site-footer">
  <p class="links">
    {% for l in site.author.links %}<a href="{{ l[1] }}" rel="me">{{ l[0] | replace: "linkedin", "LinkedIn" | replace: "github", "GitHub" | replace: "orcid", "ORCID" | replace: "scholar", "Google Scholar" }}</a>{% endfor %}
    {% if site.posts.size > 0 %}<a href="{{ '/feed.xml' | relative_url }}">RSS</a>{% endif %}
  </p>
  <p class="fine">© {{ 'now' | date: "%Y" }} {{ site.author.name }}</p>
</footer>
